[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rase"
version = "0.1.0"
description = "Relational attention structure and native semantic evidence for LVLM hallucination detection"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
vlm = ["transformers==4.57.6", "accelerate>=1.0", "Pillow>=10", "spacy>=3.7", "sentencepiece", "protobuf"]
video = ["opencv-python-headless>=4.8", "torchvision>=0.21"]
test = ["pytest>=8"]

[project.scripts]
rase = "rase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
