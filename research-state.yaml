outer_loop:
  cycle: 1
  last_direction: "execute"
  last_reflection: "LLaVA video VCD is validly active but gives uniformly unfavorable P/R/F1 point estimates with all intervals crossing zero. Together with Qwen3 rollback's nominal but inconclusive gain, the registered video matrix has not yet produced cross-model evidence; LLaVA ours and all SmartSight rows remain decisive comparisons."

